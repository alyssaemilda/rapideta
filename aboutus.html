<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapid ETA - About Us</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(to bottom, rgb(30, 33, 54), rgb(194, 189, 189));
    padding:30px;
}

.container{
    width:900px;
    background:#f2f2f2;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.title{
    text-align:center;
    padding:20px;
    font-size:40px;
    font-family:'Times New Roman', Times, serif;
    background:lightgrey;
    border-radius:12px;
    margin-bottom:20px;
}

.intro{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    text-align:center;
}

.content{
    display:flex;
    gap:20px;
}

.left-box, .right-box{
    flex:1;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.grid div{
    background:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.grid div:hover{
    transform:translateY(-5px);
}


.icon{
    font-size:50px;
}


.weather-box{
    display:none;
    background:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    text-align:center;
}


.users{
    background:white;
    padding:20px;
    border-radius:15px;
    display:flex;
    justify-content:space-around;
    text-align:center;
    margin-bottom:20px;
}

.users span{
    font-size:40px;
    display:block;
}

.contact{
    background:white;
    padding:20px;
    border-radius:15px;
}


#dropdownMenu{
    display:none;
    margin-top:10px;
}

select{
    width:100%;
    padding:10px;
    border-radius:8px;
}

</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>ABOUT US</h1>
    </div>

    <div class="intro">
        <h2>KNOW YOUR TIMING WITH US!</h2>
        <p>Train ETA, Weather & Route Info in one place</p>
    </div>

    <div class="content">

        <div class="left-box">

            <div class="grid">

                <div>
                    <div class="icon">🕒</div>
                    <p>ETA</p>
                </div>

                <div>
                    <div class="icon">📍</div>
                    <p>Route Tracker</p>
                </div>
                    <div>
                        <div class="icon" onclick="toggleTrain()">🚉</div>
                        <p>Train Station</p>

                        <div id="dropdownMenu">
                        <select id="trainLine" onchange="goToLine()">
                            <option value="">-- Choose Line --</option>

                            <option value="https://myrapid.com.my/bus-train/rapid-kl/mrt-kajang-line/">
                                MRT Kajang Line
                            </option>

                            <option value="https://myrapid.com.my/bus-train/rapid-kl/mrt-putrajaya-line/">
                                MRT Putrajaya Line
                            </option>

                            <option value="https://myrapid.com.my/bus-train/rapid-kl/lrt-kelana-jaya-line/">
                                LRT Kelana Jaya Line
                            </option>

                            <option value="https://myrapid.com.my/bus-train/rapid-kl/lrt-ampang-sri-petaling-line/">
                                LRT Ampang Line
                            </option>

                        </select>
                    </div>
                </div>

             
                <div onclick="showWeather()">
                    <div class="icon">🌤️</div>
                    <p>Weather</p>
                </div>

            </div>

        </div>

        <div class="right-box">

            <div class="users">

                <div>
                    <span>🎓</span>
                    Students
                </div>

                <div>
                    <span>🧳</span>
                    Tourists
                </div>

                <div>
                    <span>👤</span>
                    Daily Users
                </div>

            </div>

            <div class="weather-box" id="weatherBox">
                <h2>LIVE WEATHER</h2>
                <p id="temp">Click weather to load...</p>
                <p id="wind"></p>
            </div>

            <div class="contact">
                <h2>CONTACT US</h2>
                <p>📧 rapideta@gmail.com</p>
                <p>📞 +60112223344</p>
                <p>⏰ 8 AM - 10 PM</p>
            </div>

        </div>

    </div>

</div>

<script>


function toggleTrain(){
    let menu = document.getElementById("dropdownMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}


function goToLine(){
    let link = document.getElementById("trainLine").value;
    if(link){
        window.open(link, "_blank");
    }
}

function showWeather(){

    let box = document.getElementById("weatherBox");
    box.style.display = "block";

    fetch("https://api.open-meteo.com/v1/forecast?latitude=3.1390&longitude=101.6869&current_weather=true")

    .then(res => res.json())
    .then(data => {

        document.getElementById("temp").innerHTML =
            "🌡 Temperature: " + data.current_weather.temperature + "°C";

        document.getElementById("wind").innerHTML =
            "💨 Wind Speed: " + data.current_weather.windspeed + " km/h";

    })

    .catch(err => {
        document.getElementById("temp").innerHTML =
            "Failed to load weather";
    });

}

</script>

</body>
</html>
