<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Main Page</title>

<style>


*{
    box-sizing: border-box;
}

body{
    margin: 0;
    font-size: 20px;
    font-family: Arial, sans-serif;
    transition: 0.3s;
    overflow-x: hidden;
}


img.bg{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}


nav{
    background-color: rgba(211,211,211,0.9);

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;

    gap: 20px;

    padding: 15px;
    position: relative;
    z-index: 2;

    transition: 0.3s;
}


.logo{
    width: 200px;
    max-width: 100%;
}


nav a{
    text-decoration: none;
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover{
    text-decoration: underline;
}

/* ACCESSIBILITY BUTTON */
button.access-btn{
    background: none;
    border: none;
    cursor: pointer;
}

button.access-btn img{
    width: 50px;
    height: 50px;
}


div#accessMenu{
    display: none;

    position: absolute;
    top: 90px;
    right: 20px;

    background: white;
    padding: 15px;

    border: 1px solid black;
    border-radius: 10px;

    z-index: 999;
}

div#accessMenu button{
    margin: 5px;
    padding: 8px 15px;
    cursor: pointer;
}


.dark{
    background-color: black;
    color: white;
}

.dark nav{
    background-color: rgba(34,34,34,0.9);
}

.dark nav a{
    color: white;
}

.dark #accessMenu{
    background: #333;
    color: white;
    border: 1px solid white;
}


@media screen and (max-width: 768px){

    body{
        font-size: 16px;
    }

    nav{
        flex-direction: column;
        gap: 10px;
    }

    .logo{
        width: 150px;
    }

    nav a{
        display: block;
        width: 100%;
        text-align: center;
        padding: 8px;
    }

    div#accessMenu{
        position: static;
        width: 90%;
        text-align: center;
        margin-top: 10px;
    }

    button.access-btn{
        margin-top: 10px;
    }
}

</style>
</head>

<body id="page">


<img src="background.jpg" class="bg">


<header>

<nav>


    <img src="logo.png" class="logo">


    <a href="timetable.html">TRAIN TIMETABLE</a>

    <a href="routes&stations.html">
        ROUTES AND STATIONS
    </a>

    <a href="feedback.html">
        FEEDBACKS
    </a>

    <a href="aboutus.html">
        ABOUT US
    </a>

    <a href="members.html">
        MEMBERS
    </a>


    <button class="access-btn" onclick="toggleMenu()">

        <img src="access.png">

    </button>


    <div id="accessMenu">

        <button onclick="toggleDark()">
            Dark Mode
        </button>

        <br><br>

        <button onclick="increaseFont()">
            A+
        </button>

        <button onclick="decreaseFont()">
            A-
        </button>

    </div>

</nav>

</header>


<section style="padding:50px; text-align:center; color:white;">

    <h1>WELCOME TO RAPIDETA</h1>

    <p>
        Your modern train transportation website.
    </p>

</section>

<script>


let settings = {
    defaultFontSize: 20,
    darkMode: false
};


fetch("settings.json")
.then(res => res.json())
.then(data => {

    settings = data;

    document.body.style.fontSize =
        settings.defaultFontSize + "px";

    if(settings.darkMode){
        document.body.classList.add("dark");
    }

});


function toggleMenu(){

    let menu =
        document.getElementById("accessMenu");

    if(menu.style.display === "block"){

        menu.style.display = "none";

    }else{

        menu.style.display = "block";
    }
}


function toggleDark(){

    document.body.classList.
        toggle("dark");

    settings.darkMode =
        document.body.classList.contains("dark");
}


function increaseFont(){

    let size =
        parseInt(
            window.getComputedStyle(document.body)
            .fontSize
        );

    size += 2;

    document.body.style.fontSize =
        size + "px";

    settings.defaultFontSize = size;
}


function decreaseFont(){

    let size =
        parseInt(
            window.getComputedStyle(document.body)
            .fontSize
        );

    size -= 2;

    document.body.style.fontSize =
        size + "px";

    settings.defaultFontSize = size;
}

</script>

</body>
</html>
