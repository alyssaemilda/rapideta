<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Main Page</title>

<style>
body {
    margin: 0;
    font-size: 20px;
    transition: 0.3s;
}


nav {
    background-color: lightgrey;
    opacity: 0.9;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 20px;
    position: relative;
    z-index: 2;
    transition: 0.3s;
}


a {
    text-decoration: underline;
    color: black;
    transition: 0.3s;
}


img.bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
}


button.access-btn {
    position: absolute;
    left: 20px;
    top: 100%;
    margin-top: 10px;
    background: none;
    border: none;
    cursor: pointer;
}

button.access-btn img {
    width: 50px;
    height: 50px;
}


div#accessMenu {
    display: none;
    position: absolute;
    left: 20px;
    top: 140px;
    background: white;
    padding: 10px;
    border: 1px solid black;
    z-index: 999;
    transition: 0.3s;
}


.dark {
    background-color: black;
    color: white;
}

.dark nav {
    background-color: #222;
}

.dark a {
    color: white;
}

.dark div#accessMenu {
    background: #333;
    color: white;
    border: 1px solid white;
}
</style>
</head>

<body id="page">
<header>
<nav>

    <img src="logo.png" width="200">

    <a href="timetable.html">TRAIN TIMETABLE</a>
    <a href="routes&stations.html">ROUTES AND STATIONS</a>
    <a href="feedback.html">FEEDBACKS</a>
    <a href="aboutus.html">ABOUT US</a>

  
    <button class="access-btn" onclick="toggleMenu()">
        <img src="access.png">
    </button>

    <div id="accessMenu">
        <button onclick="toggleDark()">Dark Mode</button><br><br>
        <button onclick="increaseFont()">A+</button>
        <button onclick="decreaseFont()">A-</button>
    </div>

</nav>
</header>


<img src="background.jpg" class="bg">

<script>
let settings = {
    defaultFontSize: 20,
    darkMode: false
};

fetch("settings.json")
    .then(res => res.json())
    .then(data => {
        settings = data;

        // apply default settings
        document.body.style.fontSize = settings.defaultFontSize + "px";

        if (settings.darkMode) {
            document.body.classList.add("dark");
        }
    });

function toggleMenu() {
    let menu = document.getElementById("accessMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function toggleDark() {
    document.body.classList.toggle("dark");

    // update setting (optional live state)
    settings.darkMode = document.body.classList.contains("dark");
}

function increaseFont() {
    let size = parseInt(window.getComputedStyle(document.body).fontSize);
    size += 2;
    document.body.style.fontSize = size + "px";

    settings.defaultFontSize = size;
}

function decreaseFont() {
    let size = parseInt(window.getComputedStyle(document.body).fontSize);
    size -= 2;
    document.body.style.fontSize = size + "px";

    settings.defaultFontSize = size;
}
</script>

</body>
</html>
